<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Javi's Game Suite</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --dark: #343a40; --light: #f4f4f9; }
        body { font-family: -apple-system, sans-serif; background: var(--light); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* Navigation */
        .screen { display: none; width: 100%; max-width: 500px; flex-direction: column; }
        .active { display: flex; }

        /* Menu */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .card { background: white; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; border: 2px solid transparent; }
        .card:active { transform: scale(0.95); border-color: var(--primary); }
        .emoji { font-size: 2.5rem; display: block; margin-bottom: 10px; }

        /* Tables */
        .table-w { width: 100%; overflow-x: auto; background: white; border-radius: 10px; margin: 15px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { border-collapse: collapse; width: 100%; min-width: 350px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        input { width: 85%; border: none; text-align: center; font-size: 1rem; outline: none; background: transparent; }
        input[type=number] { -moz-appearance: textfield; }
        .total-row { background: #f8f9fa; font-weight: bold; }

        /* Truco Specific */
        .t-grid { display: flex; justify-content: space-between; gap: 10px; }
        .t-box { background: white; padding: 15px; border-radius: 12px; flex: 1; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .fosforitos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; }
        .m-box { width: 30px; height: 30px; border: 1px dashed #ddd; position: relative; margin: 0 auto; }
        .s { position: absolute; background: #333; opacity: 0; transition: opacity 0.1s; }
        .s.on { opacity: 1; }
        .s-l { left: 0; top: 0; width: 3px; height: 100%; }
        .s-t { top: 0; left: 0; width: 100%; height: 3px; }
        .s-r { right: 0; top: 0; width: 3px; height: 100%; }
        .s-b { bottom: 0; left: 0; width: 100%; height: 3px; }
        .s-d { top: 50%; left: 50%; width: 130%; height: 3px; transform: translate(-50%, -50%) rotate(-45deg); }

        /* Buttons */
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin: 5px 0; }
        .b-p { background: var(--primary); width: 100%; }
        .b-s { background: var(--success); }
        .b-d { background: var(--danger); width: 100%; }
        .b-w { background: var(--warning); color: #222; width: 100%; }
        .b-i { background: #17a2b8; width: 100%; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .rules { display: none; padding: 15px; background: #eef2f7; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

        <h1>Game Scorer</h1>
        <div class="menu-grid">
            <div class="card" onclick="start('generala')"><span class="emoji">🎲</span>Generala</div>
            <div class="card" onclick="start('truco')"><span class="emoji">⚔️</span>Truco</div>
